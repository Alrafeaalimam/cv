<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gahezBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>
  <!-- Base circle with subtle gold border -->
  <circle cx="60" cy="60" r="58" fill="url(#gahezBg)" stroke="url(#goldGrad)" stroke-width="3" />
  
  <!-- Delivery Scooter Icon -->
  <g transform="translate(18, 16) scale(0.72)">
    <!-- Helmet & Head -->
    <circle cx="75" cy="22" r="11" fill="url(#goldGrad)" />
    <!-- Visor -->
    <path d="M78 19 Q85 22 84 27 L76 27 Z" fill="#022c22" />
    <!-- Torso -->
    <path d="M52 44 L70 32 Q74 38 72 48 L60 56 Z" fill="url(#goldGrad)" />
    <!-- Arm to handlebar -->
    <path d="M68 38 L84 45" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Back Delivery Box -->
    <rect x="30" y="32" width="22" height="26" rx="4" fill="url(#goldGrad)" />
    <!-- Fish / Cloche emblem inside box -->
    <path d="M35 45 Q41 39 47 45 Q41 51 35 45 Z" fill="#022c22" />
    <!-- Scooter Frame -->
    <path d="M46 62 L80 62 Q85 62 88 56 L92 46" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M50 62 L60 76 L78 76" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Wheels -->
    <circle cx="42" cy="78" r="11" fill="#022c22" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="92" cy="78" r="11" fill="#022c22" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="42" cy="78" r="4" fill="url(#goldGrad)" />
    <circle cx="92" cy="78" r="4" fill="url(#goldGrad)" />
    <!-- Motion lines -->
    <line x1="16" y1="42" x2="26" y2="42" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="52" x2="24" y2="52" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="18" y1="62" x2="27" y2="62" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography: GAHEZ (جاهز) -->
  <text x="60" y="103" font-family="'Tajawal', 'Inter', sans-serif" font-size="15" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">GAHEZ جاهز</text>
</svg>
