<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.25" />
    </pattern>
  </defs>

  <!-- Dark Base Background -->
  <rect width="600" height="320" fill="url(#bgLinear)" />
  <!-- Minimalist Grid Pattern -->
  <rect width="600" height="320" fill="url(#dotGrid)" />

  <!-- Subtle glow aura -->
  <circle cx="300" cy="140" r="80" fill="#10b981" opacity="0.06" filter="blur(40px)" />
  <circle cx="340" cy="160" r="70" fill="#6366f1" opacity="0.05" filter="blur(40px)" />

  <!-- Minimalist Card Emblem Container -->
  <rect x="240" y="80" width="120" height="120" rx="24" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

  <!-- Code / Terminal Geometric Icon -->
  <g transform="translate(270, 110)">
    <path d="M16 12 L4 28 L16 44" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M44 12 L56 28 L44 44" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="34" y1="14" x2="26" y2="46" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Clean JetBrains Mono / Inter Label -->
  <g transform="translate(300, 240)">
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.8" />
    <text x="0" y="4" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">PROJECT LOGO</text>
  </g>

  <text x="300" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Placeholder preview image / asset</text>
</svg>
