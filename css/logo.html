<!DOCTYPE html>
<html>
<head>
    <title>SOFT ZONE Icon</title>
    <style>
        .icon-container {
            width: 512px;
            height: 512px;
            background: linear-gradient(135deg, #00bcd4, #ff7200);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 5px solid white;
        }
        
        .icon-text {
            font-family: Arial, sans-serif;
            font-weight: bold;
            text-align: center;
            color: white;
        }
        
        .main-text {
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .sub-text {
            font-size: 24px;
            opacity: 0.9;
        }
        
        .symbol {
            font-size: 60px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div class="icon-container">
        <div class="symbol">🕷️</div>
        <div class="icon-text">
            <div class="main-text">SOFT</div>
            <div class="sub-text">ZONE</div>
        </div>
    </div>
</body>
</html>
